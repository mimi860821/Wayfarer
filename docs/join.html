<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>加入 iKiwi 共享清單</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 32px 20px; max-width: 440px; margin-inline: auto; line-height: 1.6; }
  h1 { font-size: 22px; }
  .btn { display: block; text-align: center; padding: 14px; border-radius: 12px; background: #34a853; color: #fff; text-decoration: none; font-weight: 600; margin: 20px 0; }
  code { display: block; word-break: break-all; padding: 12px; border-radius: 10px; background: rgba(128,128,128,.18); font-size: 14px; }
  p.small { font-size: 14px; opacity: .75; }
</style>
</head>
<body>
<h1>加入 iKiwi 共享清單</h1>
<p id="msg">正在打開 iKiwi…</p>
<a class="btn" id="open" href="#">用 iKiwi 開啟</a>
<p class="small">如果沒有自動打開，請按上面的按鈕。還是不行的話，在 iKiwi 的「共享清單」選「加入朋友的房間」，貼上這組房間碼：</p>
<code id="code">（沒有房間碼）</code>
<p class="small">需要先在手機上安裝 iKiwi。房間碼就是進入房間的鑰匙，請只分享給信任的人。</p>
<script>
  var room = (location.hash || "").replace(/^#/, "").toLowerCase();
  if (/^[0-9a-f]{32}$/.test(room)) {
    var link = "ikiwi://join?room=" + room;
    document.getElementById("code").textContent = room;
    document.getElementById("open").href = link;
    setTimeout(function () { location.href = link; }, 300);
  } else {
    document.getElementById("msg").textContent = "這個連結沒有有效的房間碼。";
    document.getElementById("open").style.display = "none";
  }
</script>
</body>
</html>
