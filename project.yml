name: Wayfarer
options:
  bundleIdPrefix: com.mimi860821
  developmentLanguage: en
  createIntermediateGroups: true
packages:
  CodeEditorView:
    url: https://github.com/mchakravarty/CodeEditorView
    from: 0.15.4
targets:
  StikDebug:
    type: application
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: StikDebug
        excludes:
          - Info.plist
          - idevice/libidevice_ffi.a
          - idevice/module.modulemap
          - idevice/idevice.h
    dependencies:
      - package: CodeEditorView
        product: CodeEditorView
      - package: CodeEditorView
        product: LanguageSupport
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: StikDebug
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "NO"
        CLANG_ENABLE_MODULES: "YES"
        CODE_SIGN_ENTITLEMENTS: StikDebug/StikDebug.entitlements
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        HEADER_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/StikDebug/idevice"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/StikDebug/idevice"
        SWIFT_INCLUDE_PATHS: "$(inherited) $(PROJECT_DIR)/StikDebug/idevice"
        OTHER_LDFLAGS: "$(inherited) -lidevice_ffi -lresolv -lc++ -lz"
        INFOPLIST_FILE: StikDebug/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Wayfarer
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: "YES"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Wayfarer needs access to your local network to connect to this device.
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: Wayfarer uses location to stay running in the background and maintain the device connection.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Wayfarer uses location to stay running in the background and maintain the device connection.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_UISupportsDocumentBrowser: "YES"
        MARKETING_VERSION: "0.1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.mimi860821.wayfarer
        PRODUCT_NAME: Wayfarer
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
